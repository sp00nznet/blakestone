# The installer for this commit, for Windows, Linux and macOS (recomp-launcher
# with launcher/launcher.json): artifacts on every push to main, release files
# on a v* tag. The games are never in it: the installer builds from the
# player's own copy.
name: installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    uses: sp00nznet/recomp-launcher/.github/workflows/installer.yml@v0.3.0
    with:
      launcher-ref: v0.3.0
      name: BlakeStone-Recomp-Installer
